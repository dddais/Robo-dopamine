# Robo-Dopamine Scripted Monitor 配置示例
#
# 用途:
#   离线、不加载模型、不连机器人运行时, 按预定义曲线回放 monitor 的
#   progress, 接口与 grm / deterministic 完全一致, 用于上游 (Robot
#   Runtime / MCP adapter) 联调或回归测试。
#
# 使用方式 (典型):
#   远端串行地发 subtask -> 每个 subtask 跑到 success / fail ->
#   下一个 subtask 再发 -> ...
#   远端只需要带 monitor_id / execution_id / subtask 三个字段;
#   每个 subtask 走 success 还是 fail 曲线, 完全由本文件的
#   scenario_queue 决定 (按到达顺序消费, 队列空了默认 success)。
#
# 用法:
#   python -m monitor_runtime.service --config configs/monitor_scripted.yaml
#
# 命令行覆盖:
#   --interval 0.2          # 加快回放节拍
#   --no-hold-last          # 跑完曲线就停 (默认 --hold-last)
#   --script '[0.1,0.6,0.65]' # 临时覆盖 success_curve

# ---------------- 服务 ----------------
host: 0.0.0.0
port: 8877
backend: scripted

# 后台回放节拍 (秒)
interval: 0.5

# 跑完曲线后是否继续按最后一帧推进 (默认 true)
hold_last: true

# ---------------- 成功/失败判定 (MonitorState 阈值) ----------------
success_threshold: 0.60
success_stable_steps: 3
success_max_drift: 0.05
fail_stable_steps: 6
fail_min_progress: 0.01

# ====================================================================
# 两条预定义曲线
# ====================================================================

# ---- success 曲线 ----
# 爬坡穿过 success_threshold, 连续几步稳定 -> MonitorState 判 success
success_curve:
  progress: [0.05, 0.15, 0.30, 0.45, 0.58, 0.62, 0.64, 0.65, 0.65, 0.65]

# ---- fail 曲线 ----
# 低位平台期, 每步增量 < fail_min_progress -> MonitorState 判 failed
fail_curve:
  progress: [0.02, 0.03, 0.03, 0.04, 0.04, 0.04, 0.04, 0.04, 0.04, 0.04]

# ====================================================================
# subtask 顺序队列: 按到达顺序消费, 决定每个 subtask 走哪条曲线
# ====================================================================
# 三种写法都行:
#   scenario_queue: [success, fail, fail, success]   # 列表
#   scenario_queue: "success,fail,fail,success"      # 逗号分隔字符串
#   scenario_queue: fail                             # 单值: 每个 subtask 都 fail
#
# 别名: success=suc=ok=s ; fail=failed=ko=f
# 队列为空 / 不写 -> 默认每个 subtask 都走 success
# 队列消费完后 -> 默认 success, 或重复最后一项 (见下)
scenario_queue: [success]

# ====================================================================
# 远端调用流程 (远端不传 scenario, 完全由本配置驱动):
# ====================================================================
# POST /monitors/start
# {"monitor_id": "m-001", "execution_id": "exec-1", "subtask": "pick carrot"}
#   -> 第 1 个 subtask, 取 scenario_queue[0] = success
# 定期 POST /monitors/status -> 直到 status=success|failed
# POST /monitors/stop
#
# POST /monitors/start
# {"monitor_id": "m-002", "execution_id": "exec-1", "subtask": "open drawer"}
#   -> 第 2 个 subtask, 取 scenario_queue[1] = fail
# ... 依此类推
#
# 队列消费到第 N 个 subtask (N > len(scenario_queue)) 时:
#   默认重复队列最后一项; 队列为空则默认 success

# ====================================================================
# 下面字段在 backend=scripted 时不读取, 保留结构与 monitor.yaml 一致
# ====================================================================
robot_runtime_url: http://192.168.120.143:8767
cameras: []
observation_timeout: 3.0
auto_success_after_polls: 0
model_path: /home/ubuntu/dais/Robo-dopamine/pretrained_models/Robo-Dopamine-GRM-2.0-4B-Preview
goal_image: /home/ubuntu/dais/Robo-dopamine/examples/blank_goal.png
fisheye_config: null
no_backward: true
