# Native RoboReward-8B baseline on the complete 2,831-example benchmark.
# The second dataset root is analysis-only: it defines the exact frozen 228
# counterfactual reward=1 rows after inference and is never model-facing.
roboreward_eval:
  dataset_root: /mnt/public1/dais/workspace/data/RoboRewardBench
  split: test
  output_dir: /mnt/public1/dais/workspace/Robo-Dopamine/rewardbench/roboreward_eval/outputs/full_8b
  model_path: /mnt/public1/dais/workspace/model/RoboReward-8B
  counterfactual_dataset_root_for_metrics_only: /mnt/public1/dais/workspace/data/RoboRewardBench_counterfactual_reward1
  video_sample_fps: 1.0
  max_new_tokens: 128
  do_sample: false
  torch_dtype: bfloat16
  device_map: auto
  min_pixels: 784
  max_pixels: 50176
  shard_id: 0
  num_shards: 1
