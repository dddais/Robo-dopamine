my_dataset_eval:
  model_family: roboreward
  inputs_path: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/model_inputs/inputs.jsonl
  output_dir: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/roboreward_8b_model_card_native_front
  model_path: /mnt/public1/dais/workspace/model/RoboReward-8B
  input_protocol: checkpoint_native_front_video_model_card_v1

  # 原始 MP4 交给 checkpoint processor；媒体顺序遵循 RoboReward 模型卡
  # 引用的 Qwen3-VL video-inference 示例：video -> text。
  video_sampling_mode: checkpoint_native_video
  preprocessor_mode: checkpoint_default
  content_order: video_then_text
  do_sample: false
  max_new_tokens: 5000
  torch_dtype: bfloat16
  device_map: auto
  shard_id: 0
  num_shards: 1
