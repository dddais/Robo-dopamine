my_dataset_tracked_grounding:
  implementation: v3
  inputs_path: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/model_inputs/inputs.jsonl
  roles_path: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/roles/roles.jsonl
  split_path: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/whitebox_split/split.json
  output_dir: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/grounding_tracking_v3
  # 除模型实际 sampled frames 外，再保证至少 16 个均匀全视频审核帧；
  # 短视频会保留全部帧，便于发现渐进漂移或换到相邻同类实例。
  review_frame_count: 16
  blank_goal: /mnt/public1/dais/workspace/Robo-Dopamine/examples/blank_goal.png
  baseline_runs:
    roboreward: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/roboreward_8b_model_card_native_front
    qwen: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/qwen3vl_8b_model_card_native_front_attention8
    grm: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/grm_8b_multiview_endpoints
  roboreward_content_order_runs:
    text_then_video: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/roboreward_8b_native_front
    video_then_text: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/roboreward_8b_model_card_native_front
  sam3:
    model_path: /mnt/public1/dais/workspace/model/sam3
    checkpoint_path: /mnt/public1/dais/workspace/model/sam3/sam3.pt
    official_source_path: /mnt/public1/dais/workspace/cap-x/capx/third_party/sam3
    # 这里是 CUDA_VISIBLE_DEVICES 过滤后的进程内编号；多卡机器可按需修改。
    gpus_to_use: [0]
    device: cuda
    # SAM2-style instance tracker；视频帧放 CPU，tracking state 保留在 GPU。
    offload_video_to_cpu: true
    offload_state_to_cpu: false
    async_loading_frames: false
    threshold: 0.15
    mask_threshold: 0.50
    top_n_per_query: 20
    proposal_max_per_query: 20
    proposal_nms_iou: 0.80
    reference_exclusion_iou: 0.50
    anchor_match_iou: 0.10
    # 这些阈值只触发人工复核警告，不会把可见 track 自动判为真/假。
    # cache key 包含完整 quality contract，修改阈值不会复用旧诊断。
    drift_min_score: 0.15
    drift_min_consecutive_area_ratio: 0.10
    drift_min_anchor_area_ratio: 0.02
    drift_max_anchor_area_ratio: 50.0
    drift_max_center_step_fraction: 0.25

