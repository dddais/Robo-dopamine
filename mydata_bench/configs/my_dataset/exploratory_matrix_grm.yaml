my_dataset_exploratory_matrix:
  variant_id: grm_8b_multiview_endpoints_matrix
  model_family: grm
  model_path: /mnt/public1/dais/workspace/Robo-Dopamine/pretrained_models/Robo-Dopamine-GRM-2.0-8B-Preview
  ranking_manifest: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/ranking_cohort/grm/ordered_max20.jsonl
  evaluation_manifest: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/artifacts/my_dataset/ljx_lfz_cf_v1/attention_assumed/grm/all.jsonl
  output_dir: /mnt/public1/dais/workspace/Robo-Dopamine/mydata_bench/outputs/my_dataset/ljx_lfz_cf_v1/exploratory_matrix/grm_8b_multiview_endpoints

  # GRM 使用 official 八图 prompt；这些标记会进入 run fingerprint。
  protocol: grm_official_eight_image
  content_order: canonical_eight_image_slots
  attention_video_max_frames: 8
  ranking_prefix_sizes: [5, 10, 20]
  steering_top_k: [8, 32, 64]
  ranking_score_kind: excess_mass
  skip_early_layers: 8
  swap_bias: 6
  steering_query_scope: all
  ranking_visual_scope: target_slot_only
  intervention_visual_scope: target_slot_only
  expected_ranking_count: 20
  expected_evaluation_count: 755
  capture_generation_attentions: false

  blank_goal: /mnt/public1/dais/workspace/Robo-Dopamine/examples/blank_goal.png
  prompt_mode: official
  intervention_location: after_cam_high
  dtype: bfloat16
  device_map: auto
  min_pixels: 12544
  max_pixels: 76800
  max_new_tokens: 16
