# Reproducible RoboRewardBench paper-metric run for RoboReward-8B.
#
# The published Overall is calculated by roboreward_eval.score as the
# unweighted mean of 23 subset MAEs.  The paper does not release a standalone
# evaluator, so this configuration preserves the checkpoint's own MP4 video
# processor rather than substituting the paper's data-construction 1-FPS rule.
roboreward_eval:
  evaluation_protocol: roborewardbench_paper_v2
  dataset_root: /mnt/public1/dais/workspace/data/RoboRewardBench
  split: test
  output_dir: /mnt/public1/dais/workspace/Robo-Dopamine/rewardbench/roboreward_eval/outputs/full_8b_paper_protocol
  model_path: /mnt/public1/dais/workspace/model/RoboReward-8B
  video_sampling_mode: checkpoint_native_video
  preprocessor_mode: checkpoint_default
  content_order: text_then_video
  do_sample: false
  max_new_tokens: 5000
  torch_dtype: bfloat16
  device_map: auto
  shard_id: 0
  num_shards: 1
