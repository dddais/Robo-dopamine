# Exploratory full-benchmark screen. Episodes enter attention only if SAM3
# returns a valid box at both endpoints; no human audit is performed here.
# This configuration must not be used for formal causal claims.
grounding:
  dataset_root: /home/dais/workspace/data/RoboRewardBench
  split: test
  output_dir: /home/dais/workspace/Robo-Dopamine/rewardbench/grounding/outputs/full_sam3_auto
  parser_model_path: /home/dais/workspace/model/Qwen3-4B-Instruct-2507
  use_parser_model: true

sam3:
  model_path: /home/dais/workspace/model/sam3
  checkpoint_path: /home/dais/workspace/model/sam3/sam3.pt
  device: cuda
  threshold: 0.30
  mask_threshold: 0.50
  top_n: 10

attention_eval:
  dataset_root: /home/dais/workspace/data/RoboRewardBench
  split: test
  output_dir: /home/dais/workspace/Robo-Dopamine/rewardbench/attention_eval/outputs/full_sam3_auto_consensus
  grounding_run: /home/dais/workspace/Robo-Dopamine/rewardbench/grounding/outputs/full_sam3_auto/sam3
  model_path: /home/dais/workspace/Robo-Dopamine/pretrained_models/Robo-Dopamine-GRM-2.0-8B-Preview
  blank_goal: /home/dais/workspace/Robo-Dopamine/examples/blank_goal.png
  prompt_mode: official

  # Frozen ranking from the completed SAM3-audited reward=1 experiment.
  # Do not rank or select heads on this full benchmark screen.
  ranking_path: /home/dais/workspace/Robo-Dopamine/rewardbench/attention_eval/outputs/counterfactual_reward1_sam3_consensus/consensus_ranking.json
  eligibility_mode: auto_valid_grounding
  steering_partition: all_eligible
  run_paired: false

  # Four conditions only: baseline, candidate target, candidate wrong region,
  # and low-ranked heads at the target. This makes the full screen tractable.
  include_all_heads_control: false
  run_sensitivity: false
  run_duplicate_location_sensitivity: false
  steering_query_scope: last_prompt
  query_scope_sensitivity: []

  seed: 20260724
  discovery_fraction: 0.3333333333333333
  top_k: 8
  swap_bias: 6
  intervention_location: after_cam_high
  num_layers: 36
  num_heads: 32
  skip_early_layers: 2
  query_mode: last_prompt
  bootstrap_samples: 10000
  dtype: bfloat16
  device_map: auto
  min_pixels: 12544
  max_pixels: 76800
  max_new_tokens: 16
